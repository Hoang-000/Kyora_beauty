<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giỏ hàng — Kyora Beauty</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/Kyora_beauty/assets/css/Trangchu.css">
  <style>

    .site-header {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000
}
    .cart-page {
      padding: 40px 0;
      min-height: 50vh;
    }

    .cart-item {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid #eee;
      padding: 20px 0;
      align-items: center;
    }

    .cart-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-total {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 20px 0;
      text-align: right;
    }

    .btn-checkout {
      display: inline-block;
      background: #d45b78;
      color: white;
      padding: 12px 30px;
      text-decoration: none;
      border-radius: 5px;

      font-weight: bold;
    }

    .btn-checkout:hover {
      background: #c04b65;
    }
  </style>
</head>

<body>
  <div id="header-placeholder"></div>
  <script>
    fetch("/Kyora_beauty/components/header.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("header-placeholder").innerHTML = html;
        // Gán lại sự kiện cho nút tìm kiếm sau khi header tải xong
        const openSearch = document.getElementById('openSearch');
        const closeSearch = document.getElementById('closeSearch');
        const searchOverlay = document.getElementById('searchOverlay');
        if (openSearch && searchOverlay) openSearch.addEventListener('click', () => searchOverlay.style.display = 'flex');
        if (closeSearch && searchOverlay) closeSearch.addEventListener('click', () => searchOverlay.style.display = 'none');
      });
  </script>

  <main class="container cart-page">
    <h2>Giỏ hàng của bạn</h2>
    <div id="cart-list"></div>
    <div class="cart-total">
      Tổng: <span id="cartTotal">0đ</span>
    </div>
    <div style="overflow: hidden;">
      <a href="/Kyora_beauty/cart/checkout.html" class="btn-checkout">Thanh toán</a>
    </div>
  </main>

  <script>
    // Hàm chuyển đổi giá từ chuỗi "320.000₫" sang số 320000
    function parsePrice(priceStr) {
      if (typeof priceStr === 'number') return priceStr;
      // Loại bỏ mọi ký tự không phải số
      return parseInt(priceStr.replace(/\D/g, '')) || 0;
    }

    function formatVND(amount) {
      return amount.toLocaleString('vi-VN') + 'đ';
    }

    function renderCart() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const list = document.getElementById("cart-list");
      const totalEl = document.getElementById("cartTotal");

      let total = 0;
      list.innerHTML = "";

      if (cart.length === 0) {
        list.innerHTML = "<p>Giỏ hàng đang trống.</p>";
      } else {
        cart.forEach((item, index) => {
          const price = parsePrice(item.price);
          total += price * item.quantity;
          list.innerHTML += `
            <div class="cart-item">
              <img src="${item.image}" alt="${item.name}">
              <div style="flex: 1;">
                <h4>${item.name}</h4>
                <p>Đơn giá: ${formatVND(price)}</p>
                <div style="margin: 8px 0;">
                    <button onclick="updateQuantity(${index}, -1)" style="padding: 2px 8px; cursor: pointer;">-</button>
                    <span style="margin: 0 10px;">${item.quantity}</span>
                    <button onclick="updateQuantity(${index}, 1)" style="padding: 2px 8px; cursor: pointer;">+</button>
                </div>
                <p style="font-weight: bold;">Thành tiền: ${formatVND(price * item.quantity)}</p>
              </div>
              <button onclick="removeItem(${index})" style="background: #ff4d4d; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Xóa</button>
            </div>
            `;
        });
      }

      totalEl.innerText = formatVND(total);
    }

    // Hàm cập nhật số lượng (+/-)
    function updateQuantity(index, change) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      if (cart[index]) {
        cart[index].quantity += change;
        // Giữ số lượng tối thiểu là 1
        if (cart[index].quantity < 1) cart[index].quantity = 1;
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }
    }

    // Hàm xóa sản phẩm
    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.splice(index, 1); // Xóa 1 phần tử tại vị trí index
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    renderCart();
  </script>
  <div id="footer-placeholder"></div>
  <script>
    fetch("/Kyora_beauty/components/footer.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
      });
  </script>
</body>

</html>
