<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyora Beauty — Trang Chủ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../assets/css/Trangchu.css">
</head>

<body>

    <!-- BANNER SLIDER -->
    <section class="hero">
        <div class="swiper bannerSwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="../assets/images/Banner1.png"></div>
                <div class="swiper-slide"><img src="../assets/images/Banner2.png"></div>
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
    </section>

    <!-- HEADER (Load dynamic) -->
    <div id="header-placeholder"></div>

    <main>
        <div class="container">

            <!-- HIGHLIGHTS -->
            <section class="highlights">
                <div class="grid-3">
                    <article class="highlight">
                        <img src="../assets/images/thanh toán 1.png">
                        <h4>Thanh toán an toàn</h4>
                        <p>Nhiều phương thức thanh toán.</p>
                    </article>
                    <article class="highlight">
                        <img src="../assets/images/cam kết.png">
                        <h4>Chính hãng 100%</h4>
                        <p>Đảm bảo nguồn gốc.</p>
                    </article>
                    <article class="highlight">
                        <img src="../assets/images/vận chuyển ne.png">
                        <h4>Giao nhanh 4H</h4>
                        <p>Nội thành Hà Nội.</p>
                    </article>
                </div>
            </section>

            <!-- KHUYẾN MÃI NỔI BẬT -->
            <section class="promo-banner">
                <h2>KHUYẾN MÃI</h2>
            </section>
            <section class="home-product-section">
                <div class="product-grid" id="sale-products"></div>
            </section>

            <!-- HÀNG MỚI VỀ -->
            <section class="promo-banner new-arrival-banner">
                <h2>HÀNG MỚI VỀ</h2>
            </section>
            <section class="home-product-section">
                <div class="product-grid" id="new-products"></div>
            </section>
            <section class="new-arrivals">

            </section>

            <!-- BÁN CHẠY -->
            <section class="section-title best-sellers">
                <h2 class="section-title--flower">SẢN PHẨM BÁN CHẠY</h2>
            </section>
            <section class="best-sellers">
                <section class="home-product-section">
                    <section class="section-title best-sellers">
                        <div class="product-grid" id="best-products"></div>
                    </section>
                </section>
            </section>


            <!-- THƯƠNG HIỆU HỢP TÁC -->
            <section class="section-title">
                <h2 class="section-title--flower">THƯƠNG HIỆU NỔI BẬT</h2>
            </section>
            <section class="brands">
                <div class="brand-grid">
                    <div class="brand-item"><img src="../assets/images/oip.jpg" alt="Brand 1"></div>
                    <div class="brand-item"><img src="../assets/images/a.jpg" alt="Brand 2"></div>
                    <div class="brand-item"><img src="../assets/images/Maybelline-Logo-1915-1990s.png" alt="Brand 3">
                    </div>
                    <div class="brand-item"><img src="../assets/images/oip-1.jpg" alt="Brand 4"></div>
                </div>
            </section>
            </section>


            <!-- NEWSLETTER -->
            <section class="newsletter">
                <div class="newsletter-inner">
                    <div>
                        <h3>Nhận bản tin làm đẹp</h3>
                        <p>Giảm 10% cho đơn đầu tiên.</p>
                    </div>
                    <form class="newsletter-form">
                        <input type="email" placeholder="Nhập email">
                        <button>Đăng ký</button>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="../assets/json/products.js"></script>
    <script src="../assets/json/home-products.js"></script>
    <script src="../assets/json/slider.js"></script>

    <script>
        // Load Header
        fetch('../components/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;

                // Re-attach search events (vì HTML mới được inject vào)
                const openSearch = document.getElementById('openSearch');
                const closeSearch = document.getElementById('closeSearch');
                const searchOverlay = document.getElementById('searchOverlay');
                const searchInput = document.getElementById('searchInput');

                if (openSearch && searchOverlay) {
                    openSearch.addEventListener('click', () => {
                        searchOverlay.style.display = 'flex';
                        setTimeout(() => searchInput.focus(), 100);
                    });
                }
                if (closeSearch && searchOverlay) closeSearch.addEventListener('click', () => searchOverlay.style.display = 'none');

                // Sticky Header Logic
                const header = document.getElementById("mainHeader");
                if (header) {
                    window.addEventListener("scroll", () => {
                        if (window.scrollY > 200) header.classList.add("sticky");
                        else header.classList.remove("sticky");
                    });
                }
            });

        // Load Footer
        fetch('../components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>

</html>
