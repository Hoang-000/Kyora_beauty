<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Yêu Cầu Liên Hệ - KYORA BEAUTY</title>
    <link rel="stylesheet" href="/Kyora_beauty/assets/css/chinhsach.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
    <div class="contact-page-container">
        <h1 class="page-heading">Gửi Yêu Cầu/Ghi Chú Liên Hệ</h1>
        <p class="page-subtext">Vui lòng điền thông tin của bạn. Chúng tôi sẽ phản hồi trong thời gian sớm nhất.</p>

        <form id="contact-note-form" class="main-contact-form">
            <div class="form-group">
                <label for="contact-name">Họ và tên *</label>
                <input type="text" id="contact-name" placeholder="Nhập họ và tên của bạn" required>
            </div>
            <div class="form-group">
                <label for="contact-phone">Số điện thoại *</label>
                <input type="tel" id="contact-phone" placeholder="VD: 0987xxxxxx" required>
            </div>
            <div class="form-group">
                <label for="contact-email">Email (Tùy chọn)</label>
                <input type="email" id="contact-email" placeholder="Nhập địa chỉ email của bạn">
            </div>
            <div class="form-group">
                <label for="contact-message">Nội dung ghi chú *</label>
                <textarea id="contact-message" rows="6" placeholder="Viết tin nhắn của bạn tại đây..."
                    required></textarea>
            </div>

            <button type="submit" class="submit-contact-btn">
                <i class="fas fa-paper-plane"></i> Gửi Yêu Cầu
            </button>
        </form>

        <div id="success-message" class="contact-success-message" style="display:none;">
            <i class="fas fa-check-circle"></i> Yêu cầu của bạn đã được gửi đi thành công! Chúng tôi sẽ liên hệ lại sớm
            nhất.
            <br>
            <strong>Bạn sẽ được chuyển về trang Chính sách sau <span id="countdown">5</span> giây...</strong>

        </div>
        <a id="backLink" href="#" class="back-link"></a>

    </div>



    <script>
        // Lấy tham số URL
        const params = new URLSearchParams(window.location.search);
        const from = params.get("from");

        // Xác định trang quay về dựa trên tham số 'from'
        let backUrl = "/Kyora_beauty/index.html"; // Trang mặc định
        if (from === "bao-hanh") backUrl = "/Kyora_beauty/policies/chinh-sach-bao-hanh.html";
        if (from === "doi-tra") backUrl = "/Kyora_beauty/policies/chinh-sach-doi-tra.html";
        if (from === "giao-hang") backUrl = "/Kyora_beauty/policies/chinh-sach-giao-hang.html";

        // Set link vào nút quay lại
        document.getElementById("backLink").href = backUrl;
    </script>

    <script src="/Kyora_beauty/policies/contact-form.js"></script>
</body>

</html>
